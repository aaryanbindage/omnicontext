# Smithery configuration — https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      dataDir:
        type: string
        description: Folder for OmniContext data (default ~/.omnicontext)
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['dist/omnicontext.mjs', 'mcp'],
      env: config.dataDir ? { OMNICONTEXT_HOME: config.dataDir } : {}
    })
  exampleConfig: {}
